name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        # Prisma's CLI currently carries a high advisory through @prisma/config even
        # with --omit=dev. Keep it visible without forcing npm's unsafe downgrade.
        run: npm audit --omit=dev --audit-level=critical
